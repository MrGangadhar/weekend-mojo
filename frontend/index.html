<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF5722" />
    <meta name="description" content="Weekend Mojo - Your perfect travel companion" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Weekend Mojo - Travel Agency</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Ensure any previously registered service workers are removed so new build is fetched
      if ('serviceWorker' in navigator) {
        try {
          navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(r => r.unregister());
          }).catch(() => {});
        } catch (e) {}
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
